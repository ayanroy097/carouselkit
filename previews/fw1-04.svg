<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <rect width="1080" height="1350" fill="#0B1F33"/>
  <rect width="1080" height="8" fill="#2DD4BF"/>
  <text x="72" y="118" fill="#2DD4BF" font-family="system-ui,Segoe UI,sans-serif" font-size="22" font-weight="700">MISTAKE 03</text>
  <text x="72" y="160" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="40" font-weight="700"><tspan x="72" dy="0">No decision-map — who</tspan><tspan x="72" dy="52">decides, who blocks, what</tspan><tspan x="72" dy="52">"yes" looks like</tspan></text>
  <text x="72" y="364" fill="#B8C7D6" font-family="system-ui,Segoe UI,sans-serif" font-size="28"><tspan x="72" dy="0">Ops buys with a sponsor, a skeptic, and a</tspan><tspan x="72" dy="38">silent veto. Leave without a decision map</tspan><tspan x="72" dy="38">and your proposal dies in someone else's</tspan><tspan x="72" dy="38">inbox.</tspan></text>
  <text x="72" y="1294" fill="#B8C7D6" font-family="system-ui,Segoe UI,sans-serif" font-size="18">CarouselKit · Framework 1 — Mistakes</text>
  <text x="1008" y="1294" fill="#2DD4BF" font-family="system-ui,Segoe UI,sans-serif" font-size="18" font-weight="700" text-anchor="end">04 / 08</text>
</svg>
