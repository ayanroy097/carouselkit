  <text x="72" y="160" fill="#FFFFFF" font-family="system-ui,Segoe UI,sans-serif" font-size="40" font-weight="700"><tspan x="72" dy="0">Diagnose before you</tspan><tspan x="72" dy="52">prescribe. Map power before</tspan><tspan x="72" dy="52">you pitch.</tspan></text>
  <text x="72" y="364" fill="#B8C7D6" font-family="system-ui,Segoe UI,sans-serif" font-size="28"><tspan x="72" dy="0">1) System map → 2) Their words → 3)</tspan><tspan x="72" dy="38">Decision map → 4) Change surface → 5) Next</tspan><tspan x="72" dy="38">commit. That is the discovery call that</tspan><tspan x="72" dy="38">leads to a signed SOW.</tspan></text>
